[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Next.js App Router + Route Handlers laufen über das offizielle Runtime-Plugin.
# Netlify erkennt Next.js meist automatisch; explizit ist es zuverlässiger.
[[plugins]]
  package = "@netlify/plugin-nextjs"
